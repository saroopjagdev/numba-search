[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness", "engine", "tools", "training"]

# numba's decorators erase signatures, so jitted call sites and the tables they read come back
# as Any. Silencing the module wholesale would hide real errors in the plain-Python parts, so
# only the specific consequences of that erasure are allowed.
[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true

# Offline training dependencies. None of these ship, and none are installed in the match
# container -- they exist only in the local venv, added with `uv pip install`, deliberately not as
# project dependencies so that nothing in `engine/` can ever import one by accident.
[[tool.mypy.overrides]]
module = ["zstandard.*", "orjson.*"]
ignore_missing_imports = true
